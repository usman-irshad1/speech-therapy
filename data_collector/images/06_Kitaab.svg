<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect width="200" height="200" rx="24" fill="#ffe4e6"/>
  <!-- Card Header Badge -->
  <rect x="15" y="15" width="40" height="24" rx="8" fill="#e11d48" opacity="0.9"/>
  <text x="35" y="31" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">#6</text>
  
  <!-- Illustration Icon Art -->
  <circle cx="100" cy="95" r="48" fill="#ffffff" stroke="#e11d48" stroke-width="4" opacity="0.9"/>
  
  <!-- Word Urdu & English Label -->
  <text x="100" y="90" font-family="'Noto Nastaliq Urdu', 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="bold" fill="#0f172a" text-anchor="middle">کتاب</text>
  <text x="100" y="115" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#e11d48" text-anchor="middle">Kitaab</text>
  
  <!-- Footer Target Sound Badge -->
  <rect x="20" y="155" width="160" height="28" rx="8" fill="#ffffff" stroke="#e11d48" stroke-width="1.5"/>
  <text x="100" y="173" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle">Target: Stop /k/, /t/, /b/</text>
</svg>