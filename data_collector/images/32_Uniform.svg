<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect width="200" height="200" rx="24" fill="#dcfce7"/>
  <!-- Card Header Badge -->
  <rect x="15" y="15" width="40" height="24" rx="8" fill="#16a34a" opacity="0.9"/>
  <text x="35" y="31" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">#32</text>
  
  <!-- Illustration Icon Art -->
  <circle cx="100" cy="95" r="48" fill="#ffffff" stroke="#16a34a" stroke-width="4" opacity="0.9"/>
  
  <!-- Word Urdu & English Label -->
  <text x="100" y="90" font-family="'Noto Nastaliq Urdu', 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="bold" fill="#0f172a" text-anchor="middle">یونیفارم</text>
  <text x="100" y="115" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#16a34a" text-anchor="middle">Uniform</text>
  
  <!-- Footer Target Sound Badge -->
  <rect x="20" y="155" width="160" height="28" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="100" y="173" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle">Target: Glide /j/, Nasal /n/, Fricative /f/, Trill /r/, Nasal /m/</text>
</svg>